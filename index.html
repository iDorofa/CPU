<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Процессор из логических элементов · Змейка</title>
<style>
:root{--bg:#0d1b2a;--panel:#14263a;--line:#2a4560;--fg:#e4edf5;--mut:#8aa3b8;--acc:#ffb547}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif}
header{display:flex;gap:14px;align-items:center;padding:10px 14px;background:var(--panel)}
header a{color:var(--acc)}
main{display:flex;flex-wrap:wrap;gap:14px;padding:14px;max-width:1100px;margin:auto}
section{flex:1 1 320px;min-width:0}
#scr{width:100%;max-width:340px;height:auto;display:block;border-radius:10px;border:1px solid var(--line);touch-action:none}
button,input{background:#1d3550;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 12px;font:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc)}
button.hot{background:var(--acc);color:#1a1000;border-color:var(--acc)}
#pad{display:grid;grid-template-columns:repeat(3,52px);gap:8px;margin:12px 0 16px}
#pad button,#kp button{width:46px;height:46px;border-radius:50%;border:2px solid #0a0d11;background:radial-gradient(circle at 35% 28%,#6a7482,#1c2128 72%);color:#e4edf5;font-size:17px;padding:0;box-shadow:0 4px 0 #080a0d,0 7px 10px rgba(0,0,0,.55),inset 0 1px 1px rgba(255,255,255,.3);transition:transform .05s,box-shadow .05s}
#pad button:active,#kp button:active{transform:translateY(3px);background:radial-gradient(circle at 35% 28%,#8a7a3a,#3a3112 72%);box-shadow:0 1px 0 #080a0d,0 2px 4px rgba(0,0,0,.55),inset 0 1px 1px rgba(255,255,255,.2)}
#kp button{width:34px;height:34px;font-size:13px;border-width:1.5px;box-shadow:0 3px 0 #080a0d,0 5px 7px rgba(0,0,0,.5),inset 0 1px 1px rgba(255,255,255,.3)}
#reg,#msg,#stat{font:12px/1.5 ui-monospace,Consolas,monospace;color:var(--mut);white-space:pre-wrap}
#ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
textarea{width:100%;height:330px;background:#0a1521;color:#cfe3f3;border:1px solid var(--line);border-radius:8px;padding:10px;font:12.5px/1.45 ui-monospace,Consolas,monospace;resize:vertical}
#msg{margin:6px 0;min-height:18px}#msg.err{color:#ff7b7b}
#sch{width:100%;height:62vh;min-height:320px;display:block;border-top:1px solid var(--line);border-bottom:1px solid var(--line);touch-action:none;cursor:grab}
#sysh{margin:0;padding:14px 14px 4px;font-size:18px}#sysn{padding:0 14px 8px;color:var(--mut);font-size:13px}#syswrap{overflow:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}#sys{display:block;width:100%;min-width:1000px;cursor:default;touch-action:manipulation}
#romhelp{margin:0;padding:6px 14px 10px;color:var(--fg)}#romhelp summary{cursor:pointer;font-size:16px;font-weight:600;padding:6px 0}.rh{max-width:860px;line-height:1.5;color:var(--mut)}.rh b{color:var(--fg)}.rh ol{padding-left:20px;margin:6px 0}.rh li{margin:3px 0}
#romlive table{border-collapse:collapse;margin-top:8px;font:12px ui-monospace,Consolas,monospace}#romlive td,#romlive th{padding:3px 8px;border:1px solid var(--line);text-align:center}#romlive tr.cur td{background:#3a3112;color:var(--acc)}#romlive .one{color:#3bff6a;font-weight:700}#romlive .zero{color:#4a6178}
#tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 14px}
#leg span{margin-right:12px;white-space:nowrap}
#leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
</style></head><body>
